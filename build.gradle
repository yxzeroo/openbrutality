plugins {
    id 'java'
    id 'application'
}

group = 'org.brutality'
version = '2.6'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

application {
    mainClass = 'net.minecraft.client.main.Main'
}

repositories {
    mavenCentral()
    maven {
        name = 'Mojang'
        url = 'https://libraries.minecraft.net'
    }
    maven {
        name = 'ViaVersion'
        url = 'https://repo.viaversion.com'
    }
    maven {
        name = 'JitPack'
        url = 'https://jitpack.io'
    }
}

dependencies {
    // Unmodified host application base (Minecraft 1.8.9 MCP + OptiFine HD U M5 unmodified classes)
    implementation files('libs/minecraft-1.8.9-optifine-M5-base.jar')

    // Product & client libraries (exact versions from META-INF/maven/*/pom.properties)
    implementation 'com.google.code.gson:gson:2.12.1'
    implementation 'com.google.guava:guava:17.0'
    implementation 'io.netty:netty-all:4.0.23.Final'
    implementation 'net.sf.jopt-simple:jopt-simple:4.6'
    implementation 'org.apache.logging.log4j:log4j-api:2.25.5'
    implementation 'org.apache.logging.log4j:log4j-core:2.25.5'
    implementation 'org.java-websocket:Java-WebSocket:1.5.1'
    implementation 'org.json:json:20231013'
    implementation 'org.slf4j:slf4j-api:1.7.36'
    runtimeOnly 'org.slf4j:slf4j-nop:1.7.36'
    implementation 'org.yaml:snakeyaml:2.2'

    // ViaMCP / ViaLoadingBase protocol translation stack
    implementation('com.viaversion:viaversion-common:5.3.0') { transitive = false }
    implementation('com.viaversion:viabackwards-common:5.3.0') { transitive = false }
    implementation('com.viaversion:viarewind-common:4.0.6') { transitive = false }
    implementation 'com.viaversion:nbt:5.1.0'
    implementation('net.lenni0451.mcstructs:text:2.5.3') { transitive = false }

    // Microsoft / Alt authentication, Discord RPC & bytecode utilities
    implementation('com.github.Litarvan:OpenAuth:v1.1.2') { transitive = false }
    implementation('com.github.Vatuu:discord-rpc:1.6.2') { transitive = false }
    implementation 'org.ow2.asm:asm:9.7.1'
    implementation 'org.ow2.asm:asm-tree:9.7.1'
    implementation 'org.ow2.asm:asm-commons:9.7.1'
    compileOnly 'org.projectlombok:lombok:1.18.36'

    // Minecraft 1.8.9 official Mojang runtime dependencies
    implementation('com.mojang:authlib:1.5.21') { transitive = false }
    implementation('com.mojang:realms:1.7.59') { transitive = false }
    implementation('com.mojang:netty:1.8.8') { transitive = false }
    implementation('oshi-project:oshi-core:1.1') { transitive = false }
    implementation 'net.java.dev.jna:jna:3.4.0'
    implementation 'net.java.dev.jna:platform:3.4.0'
    implementation 'com.ibm.icu:icu4j-core-mojang:51.2'
    implementation('com.paulscode:codecjorbis:20101023') { transitive = false }
    implementation('com.paulscode:codecwav:20101023') { transitive = false }
    implementation('com.paulscode:libraryjavasound:20101123') { transitive = false }
    implementation('com.paulscode:librarylwjglopenal:20100824') { transitive = false }
    implementation('com.paulscode:soundsystem:20120107') { transitive = false }
    implementation 'org.apache.commons:commons-lang3:3.3.2'
    implementation 'commons-io:commons-io:2.4'
    implementation 'commons-codec:commons-codec:1.9'
    implementation 'org.apache.commons:commons-compress:1.8.1'
    implementation 'org.apache.httpcomponents:httpclient:4.3.3'
    implementation 'org.apache.httpcomponents:httpcore:4.3.2'
    implementation 'commons-logging:commons-logging:1.1.3'
    implementation('net.java.jinput:jinput:2.0.5') { transitive = false }
    implementation('net.java.jutils:jutils:1.0.0') { transitive = false }
    implementation('org.lwjgl.lwjgl:lwjgl:2.9.4-nightly-20150209') { transitive = false }
    implementation('org.lwjgl.lwjgl:lwjgl_util:2.9.4-nightly-20150209') { transitive = false }
    implementation('tv.twitch:twitch:6.5') { transitive = false }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += [
        '-parameters',
        '--add-exports', 'java.base/sun.nio.ch=ALL-UNNAMED',
        '--add-exports', 'java.desktop/sun.awt=ALL-UNNAMED',
        '-Xmaxerrs', '1000',
    ]
}

tasks.named('jar') {
    manifest {
        from('src/main/resources/META-INF/MANIFEST.MF')
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Reproduces the shipped standalone uber-JAR layout (bundling runtime dependencies & shading third-party jars)
tasks.register('uberJar', Jar) {
    archiveClassifier = 'all'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        from('src/main/resources/META-INF/MANIFEST.MF')
    }
    from(sourceSets.main.output)
    dependsOn(configurations.runtimeClasspath)
    from({
        configurations.runtimeClasspath.findAll { it.name.endsWith('.jar') }.collect { zipTree(it) }
    }) {
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    }
}
